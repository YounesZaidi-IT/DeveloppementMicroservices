# Orchestration du projet — complétée au fil des séances.
# TP1 : vehicules + sa base démarrent tels quels.
# TP4 : déclarez locations + db-locations sur le modèle du service vehicules.
# TP6 : dé-commentez rabbitmq puis notifications.
# TP7 : dé-commentez paiement.  TP8 : déclarez auth + db-auth.

services:

  vehicules:
    build: services/vehicules
    environment:
      DATABASE_URL: ${VEHICULES_DATABASE_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
    ports:
      - "8000:8000"
    depends_on:
      db-vehicules:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: always

  db-vehicules:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: vehicules
    volumes:
      - data-vehicules:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d vehicules"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---- TP4 — locations + db-locations -----------------------------------

  locations:
    build: services/locations
    environment:
      DATABASE_URL: ${LOCATIONS_DATABASE_URL}
    ports:
      - "8002:8000"
    depends_on:
      db-locations:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: always

  db-locations:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: locations
    volumes:
      - data-locations:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d locations"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---- TP6 — dé-commentez : ----------------------------------------------
  # rabbitmq:
  #   image: rabbitmq:3-management
  #   ports:
  #     - "5672:5672"
  #     - "15672:15672"
  #   healthcheck:
  #     test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 10
  #
  # notifications:
  #   build: services/notifications
  #   environment:
  #     RABBITMQ_URL: ${RABBITMQ_URL}
  #   depends_on:
  #     rabbitmq:
  #       condition: service_healthy
  #   restart: always

  # ---- TP7 — dé-commentez : ----------------------------------------------
  # paiement:
  #   build: services/paiement
  #   environment:
  #     RABBITMQ_URL: ${RABBITMQ_URL}
  #   depends_on:
  #     rabbitmq:
  #       condition: service_healthy
  #   restart: always

  # ---- TP8 — À vous : auth + db-auth (port conseillé : 8004:8000) --------

volumes:
  data-vehicules:
  data-locations: